# Environment for the DankMaterialShell session, shipped by the image instead
# of the per-user ~/.config/environment.d/90-dms.conf that dankinstall writes.
ELECTRON_OZONE_PLATFORM_HINT=auto
TERMINAL=ghostty
# Qt theming goes through the gtk3 platform theme (the DMS upstream default and
# what `dms doctor` expects). Do not set this to qtengine: the matugen qtengine
# path is mutually exclusive with the gtk3/qt6ct path.
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORMTHEME_QT6=gtk3
