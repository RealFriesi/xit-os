# Umbriel configuration entry point.
# Distro defaults from /usr/share/srvb/umbriel/ are included below.
# Comment out any default file to replace it with your own configuration or overrides.

[include]
files = [
    "/usr/share/xit-os/umbriel/general.toml",
    "/usr/share/xit-os/umbriel/workspaces.toml",
    "/usr/share/xit-os/umbriel/appearance.toml",
    "/usr/share/xit-os/umbriel/input.toml",
    "/usr/share/xit-os/umbriel/scratchpads.toml",
    "/usr/share/xit-os/umbriel/keybinds.toml",
    "/usr/share/xit-os/umbriel/layout.toml",
    "/usr/share/xit-os/umbriel/window-rules.toml",
    "/usr/share/xit-os/umbriel/layer-rules.toml",
    "/usr/share/xit-os/umbriel/animation.toml",
    "/usr/share/xit-os/umbriel/overview.toml",
    "/usr/share/xit-os/umbriel/security.toml",
    "noctalia.toml"
]

[include.optional]
files = []

