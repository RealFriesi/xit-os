[include]
files = [
    "input.toml",
    "keybinds.toml",
    "noctalia.toml",
    "environment.toml",
    "layout.toml",
    "workspaces.toml",
    "appearance.toml",
    "rules-window.toml",
    "rules-layer.toml",
    "output.toml",
]

[include.optional]
files = []

[general]
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = true
focus_on_activate = false
honor_restored_maximize = false


[events]
# lid_close = "notify-send 'The laptop lid is closed'"
# lid_open = "notify-send 'The laptop lid is open'"

[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = true

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"
